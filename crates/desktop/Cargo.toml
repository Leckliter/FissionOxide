[package]
name = "fox-desktop"
description = "Desktop integration for FissionOxide: updates from GitHub releases, settings, the Windows tray icon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
log.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip", "win-system-proxy"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }

# The Windows pointer fix (`pointer.rs`) subclasses the window, which needs `unsafe`, so this
# crate can't inherit the workspace's `unsafe_code = "forbid"`. It denies it instead and allows it
# only in that module.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
