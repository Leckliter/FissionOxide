[package]
name = "fox-desktop"
description = "Desktop integration for FissionOxide: updates from GitHub releases, settings, the Windows tray icon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
log.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip", "win-system-proxy"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[lints]
workspace = true
