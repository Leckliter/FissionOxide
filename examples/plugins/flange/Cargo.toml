[package]
name = "flange-plugin"
description = "Example FissionOxide plugin: bolt flanges and a body report"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Not part of the FissionOxide workspace: it builds for wasm32-unknown-unknown (see build.sh).
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
