[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
fox-expr = { path = "crates/expr" }
fox-sketch = { path = "crates/sketch" }
fox-kernel = { path = "crates/kernel" }
fox-model = { path = "crates/model" }
fox-render = { path = "crates/render" }
fox-engine = { path = "crates/engine" }
fox-ui = { path = "crates/ui" }
fox-exchange = { path = "crates/exchange" }
fox-store = { path = "crates/store" }
fox-trace = { path = "crates/trace" }
fox-render-gl = { path = "crates/render-gl" }
fox-brand = { path = "crates/brand" }
fox-cut = { path = "crates/cut" }
fox-desktop = { path = "crates/desktop" }
fox-hub-server = { path = "crates/hub-server" }
fox-ecad = { path = "crates/ecad" }
fox-plugin = { path = "crates/plugin" }
fox-sim = { path = "crates/sim" }
fox-form = { path = "crates/form" }
fox-gen = { path = "crates/gen" }
fox-raytrace = { path = "crates/raytrace" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
glam = { version = "0.24", features = ["serde"] }
opencascade = "0.3"
opencascade-sys = "0.3"
cxx = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
env_logger = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
ttf-parser = "0.25"
epaint_default_fonts = "0.36"
cavalier_contours = "0.9"
jagua-rs = { version = "1.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

# the topology optimisation solver is all number crunching
[profile.dev.package.fox-gen]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
