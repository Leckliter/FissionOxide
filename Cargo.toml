[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
clf-expr = { path = "crates/expr" }
clf-sketch = { path = "crates/sketch" }
clf-kernel = { path = "crates/kernel" }
clf-model = { path = "crates/model" }
clf-render = { path = "crates/render" }
clf-engine = { path = "crates/engine" }
clf-ui = { path = "crates/ui" }
clf-exchange = { path = "crates/exchange" }
clf-store = { path = "crates/store" }
clf-trace = { path = "crates/trace" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
glam = { version = "0.24", features = ["serde"] }
opencascade = "0.3"
opencascade-sys = "0.3"
cxx = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
env_logger = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
ttf-parser = "0.25"
epaint_default_fonts = "0.36"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
